<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Rio Clássica | Login</title>

    <link rel="icon" type="image/png" href="/assets/image/logo.png">
    <link rel="shortcut icon" type="image/png" href="/assets/image/logo.png">
    <link rel="apple-touch-icon" href="/assets/image/logo.png">

    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {

            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

            background: linear-gradient(135deg, #3d2817 0%, #6d5a47 100%);

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }

        .login-container {

            background: white;

            border-radius: 12px;

            box-shadow: 0 20px 60px rgba(61, 40, 23, 0.3);

            padding: 60px 40px;

            width: 100%;

            max-width: 400px;

        }

        .logo { text-align: center; margin-bottom: 40px; }

        .logo h1 { font-size: 28px; color: #3d2817; margin-bottom: 5px; }

        .logo p { font-size: 12px; color: #a67c52; letter-spacing: 2px; text-transform: uppercase; }

        .form-group { margin-bottom: 20px; }

        label { display: block; margin-bottom: 8px; color: #3d2817; font-weight: 600; font-size: 14px; }

        input {

            width: 100%;

            padding: 12px 16px;

            border: 2px solid #d4b896;

            border-radius: 6px;

            font-size: 14px;

            font-family: inherit;

        }

        input:focus { outline: none; border-color: #a67c52; background-color: #f4ede4; }

        .btn-login {

            width: 100%;

            padding: 14px;

            background: linear-gradient(135deg, #3d2817 0%, #6d5a47 100%);

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 10px;

        }

        .error-message, .success-message {

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 20px;

            font-size: 14px;

            display: none;

        }

        .error-message { background: #fee; color: #c33; border-left: 4px solid #c33; }

        .success-message { background: #efe; color: #3c3; border-left: 4px solid #3c3; }

        .loading { display: none; text-align: center; color: #666; font-size: 14px; margin-top: 20px; }

        .info-text { text-align: center; font-size: 13px; color: #6d5a47; margin-top: 20px; line-height: 1.6; }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">

            <h1>RIOCLÁSSICA</h1>

            <p>PAINEL ADMINISTRATIVO</p>

        </div>



        <div class="error-message" id="errorMessage"></div>

        <div class="success-message" id="successMessage"></div>



        <form id="loginForm">

            <div class="form-group">

                <label for="email">Email</label>

                <input type="email" id="email" required placeholder="seu@email.com">

            </div>

            <div class="form-group">

                <label for="password">Senha</label>

                <input type="password" id="password" required placeholder="••••••••">

            </div>

            <button type="submit" class="btn-login">Entrar no Dashboard</button>

            <div class="loading" id="loading">Autenticando...</div>

        </form>



        <p class="info-text">

            Login e dados no <strong>Supabase</strong>.<br>

            Crie o usuário em Authentication → Users.

        </p>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>

    <script src="../js/config/supabase-config.js"></script>

    <script src="../js/core/supabase-errors.js"></script>

    <script src="../js/core/supabase-client.js"></script>

    <script src="../js/auth/auth.js"></script>

    <script>

        document.addEventListener('DOMContentLoaded', () => {

            const form = document.getElementById('loginForm');

            const errorEl = document.getElementById('errorMessage');

            const successEl = document.getElementById('successMessage');

            const loading = document.getElementById('loading');



            onAuthStateChanged((user) => {

                if (user) window.location.href = '/admin/dashboard.html';

            });



            form.addEventListener('submit', async (e) => {

                e.preventDefault();

                errorEl.style.display = 'none';

                successEl.style.display = 'none';

                loading.style.display = 'block';



                try {

                    await signInWithEmail(

                        document.getElementById('email').value.trim(),

                        document.getElementById('password').value

                    );

                    successEl.textContent = '✓ Login realizado! Redirecionando...';

                    successEl.style.display = 'block';

                    setTimeout(() => { window.location.href = '/admin/dashboard.html'; }, 600);

                } catch (err) {

                    errorEl.textContent = '❌ ' + getAuthErrorMessage(err);

                    errorEl.style.display = 'block';

                } finally {

                    loading.style.display = 'none';

                }

            });

        });

    </script>

</body>

</html>
